[package]
name = "ant-db-inspector"
version = "0.1.0"
description = "Inspect ant-node chunk databases (LMDB): tables, schema, records, XOR addresses, statistics"
edition.workspace = true
license.workspace = true

[dependencies]
heed.workspace = true
blake3.workspace = true
hex.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Autonomi serializes public DataMaps with rmp-serde (MessagePack); we use the
# same crate to deserialize candidate chunks back into mirror structs.
rmp-serde = "1"
page_size = "0.6"

[dev-dependencies]
tempfile = "3"
