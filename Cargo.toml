[workspace]
resolver = "2"
members = ["ant-inspect", "teststore-gen"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# The exact self_encryption line the autonomi client (WithAutonomi/ant-client,
# ant-core/Cargo.toml: self_encryption = "0.36") uses, so DataMap parsing and
# the --resolve decryption match the real wire format bit for bit.
self_encryption = "0.36"
xor_name = "5"
# The client serializes a public DataMap with rmp-serde (MessagePack) before
# storing it as a chunk (ant-core/src/data/client/data.rs: data_map_store).
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
